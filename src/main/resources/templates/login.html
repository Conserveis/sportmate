<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('เข้าสู่ระบบ')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span>SPORTMATE</div>
        <div class="auth-sub">หาเพื่อนเล่นกีฬา จัดทีม นัดหมาย จบในที่เดียว</div>

        <div class="flash err" th:if="${error}" th:text="${error}"></div>
        <div class="flash err" th:if="${oauthError}">
            เข้าสู่ระบบผ่านผู้ให้บริการภายนอกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง
        </div>

        <form method="post" th:action="@{/login}">
            <div class="field">
                <label>ชื่อผู้ใช้ หรือ อีเมล</label>
                <input name="username" th:value="${username}" required autofocus>
            </div>
            <div class="field">
                <label>รหัสผ่าน</label>
                <input type="password" name="password" required>
            </div>
            <label style="display:flex;align-items:center;gap:8px;margin:-2px 0 16px;color:var(--muted);font-size:.9rem;cursor:pointer">
                <input type="checkbox" name="rememberMe" value="true" th:checked="${rememberMe}">
                จดจำบัญชีของฉันเป็นเวลา 30 วัน
            </label>
            <button class="btn btn-primary" style="width:100%">เข้าสู่ระบบ</button>
        </form>

<div class="oauth-divider" th:if="${oauthProviders != null and not #lists.isEmpty(oauthProviders)}"><span>หรือ</span></div>

        <div class="oauth-list" th:if="${oauthProviders != null}">
            <a th:each="p : ${oauthProviders}"
                class="btn-oauth" th:classappend="'btn-oauth-' + ${p.id}"
                th:href="@{${p.url}}">
                <img th:if="${p.id == 'google'}" class="oauth-mark" th:src="@{/images/google-logo.webp}" alt="Google">
                <img th:if="${p.id == 'thaid'}" class="oauth-mark" th:src="@{/images/thaid-logo.png}" alt="ThaiD">
                <span th:text="${p.label}">ผู้ให้บริการ</span>
            </a>
        </div>

        <div class="auth-alt">ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a></div>
    </div>
</div>
</body>
</html>
