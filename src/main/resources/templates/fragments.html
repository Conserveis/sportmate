<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · SportMate'">SportMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<nav class="nav" th:fragment="nav(active)">
    <div class="nav-inner">
        <a class="brand" th:href="@{/posts}"><span class="dot"></span>SportMate</a>
        <a class="link" th:classappend="${active=='posts'}?'active'" th:href="@{/posts}">Post</a>
        <a class="link" th:classappend="${active=='tournaments'}?'active'" th:href="@{/tournaments}">Tournament</a>
        <a class="link" th:classappend="${active=='archive'}?'active'" th:href="@{/archive}">จัดเก็บกิจกรรม</a>
        <a class="link" th:classappend="${active=='profile'}?'active'" th:href="@{/profile}">โปรไฟล์</a>
        <span class="spacer"></span>
        <a class="bell" th:classappend="${active=='notifications'}?'active'" th:href="@{/notifications}" title="การแจ้งเตือน">
            🔔<span class="bell-badge" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}">0</span>
        </a>
        <span class="who" th:if="${currentUser}">
            <span th:text="${currentUser.userName}">user</span>
            <span class="badge-member" th:if="${currentUser.member}">Member</span>
        </span>
        <a class="link" th:href="@{/logout}">ออกจากระบบ</a>
    </div>
</nav>

<!-- ===== filter/search bar (ใช้ทั้งหน้า posts และ tournaments) ===== -->
<div class="filter-bar" th:fragment="filterBar(action)">
    <form method="get" th:action="@{__${action}__}">
        <div class="filter-grid">
            <div class="field">
                <label>ประเภทกีฬา</label>
                <select name="sportId">
                    <option value="">ทั้งหมด</option>
                    <option th:each="s : ${sports}" th:value="${s.id}" th:text="${s.name}"
                            th:selected="${fSportId != null and fSportId == s.id}"></option>
                </select>
            </div>
            <div class="field">
                <label>สถานที่</label>
                <select name="locationId">
                    <option value="">ทั้งหมด</option>
                    <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}"
                            th:selected="${fLocationId != null and fLocationId == l.id}"></option>
                </select>
            </div>
            <div class="field">
                <label>วันที่</label>
                <input type="date" name="date" th:value="${fDate}">
            </div>
            <div class="field">
                <label>เวลา (ตั้งแต่)</label>
                <input type="time" name="time" th:value="${fTime}">
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary btn-sm" type="submit">ค้นหา</button>
                <a class="btn btn-ghost btn-sm" th:href="@{__${action}__}">ล้าง</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
