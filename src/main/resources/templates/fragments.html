<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' · SportMate'">SportMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('select').forEach(function (select) {
                if (select.parentElement.classList.contains('select-wrap')) return;

                var wrapper = document.createElement('div');
                wrapper.className = 'select-wrap';
                select.parentNode.insertBefore(wrapper, select);
                wrapper.appendChild(select);

                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'select-button';
                button.setAttribute('aria-haspopup', 'listbox');
                button.setAttribute('aria-expanded', 'false');
                wrapper.appendChild(button);

                var menu = document.createElement('div');
                menu.className = 'select-menu';
                menu.setAttribute('role', 'listbox');
                wrapper.appendChild(menu);

                function syncSelection() {
                    var selected = select.options[select.selectedIndex];
                    button.firstChild && button.removeChild(button.firstChild);
                    button.insertBefore(document.createTextNode(selected ? selected.text : ''), button.firstChild);
                    menu.querySelectorAll('.select-option').forEach(function (option, index) {
                        option.classList.toggle('selected', index === select.selectedIndex);
                        option.setAttribute('aria-selected', index === select.selectedIndex);
                    });
                }

                Array.from(select.options).forEach(function (option, index) {
                    var item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'select-option';
                    item.textContent = option.text;
                    item.setAttribute('role', 'option');
                    item.addEventListener('click', function () {
                        select.selectedIndex = index;
                        select.dispatchEvent(new Event('change', { bubbles: true }));
                        syncSelection();
                        wrapper.classList.remove('open');
                        button.setAttribute('aria-expanded', 'false');
                    });
                    menu.appendChild(item);
                });

                button.addEventListener('click', function () {
                    var isOpen = wrapper.classList.toggle('open');
                    button.setAttribute('aria-expanded', isOpen);
                });
                select.addEventListener('change', syncSelection);
                syncSelection();
            });

            var monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            var weekDays = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            document.querySelectorAll('input[type="date"]').forEach(function (input) {
                var wrapper = document.createElement('div');
                wrapper.className = 'date-wrap';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'date-button';
                wrapper.appendChild(button);

                var popup = document.createElement('div');
                popup.className = 'calendar-popup';
                wrapper.appendChild(popup);
                var today = new Date();
                var view = input.value ? new Date(input.value + 'T00:00:00') : today;

                function renderCalendar() {
                    var year = Math.min(9999, Math.max(1, view.getFullYear()));
                    var month = view.getMonth();
                    var firstDay = new Date(year, month, 1).getDay();
                    var daysInMonth = new Date(year, month + 1, 0).getDate();
                    popup.innerHTML = '';
                    var head = document.createElement('div');
                    head.className = 'calendar-head';
                    head.innerHTML = '<strong class="calendar-title">' + monthNames[month] + '</strong>'
                        + '<input class="calendar-year" type="number" min="1" max="9999" value="' + year + '">';
                    var nav = document.createElement('div');
                    nav.className = 'calendar-nav';
                    nav.innerHTML = '<button type="button" data-step="-1">‹</button><button type="button" data-step="1">›</button>';
                    head.appendChild(nav);
                    popup.appendChild(head);
                    head.querySelector('.calendar-year').addEventListener('input', function (event) {
                        if (event.target.value.length > 4) event.target.value = event.target.value.slice(0, 4);
                    });
                    var grid = document.createElement('div');
                    grid.className = 'calendar-grid';
                    weekDays.forEach(function (day) {
                        var label = document.createElement('span');
                        label.className = 'calendar-weekday';
                        label.textContent = day;
                        grid.appendChild(label);
                    });
                    for (var blank = 0; blank < firstDay; blank++) grid.appendChild(document.createElement('span'));
                    for (var dayNumber = 1; dayNumber <= daysInMonth; dayNumber++) {
                        var day = document.createElement('button');
                        day.type = 'button';
                        day.className = 'calendar-day';
                        var iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(dayNumber).padStart(2, '0');
                        day.textContent = dayNumber;
                        day.dataset.value = iso;
                        if (input.value === iso) day.classList.add('selected');
                        grid.appendChild(day);
                    }
                    popup.appendChild(grid);
                    var footer = document.createElement('div');
                    footer.className = 'calendar-footer';
                    footer.innerHTML = '<button type="button" data-action="clear">Clear</button><button type="button" data-action="today">Today</button>';
                    popup.appendChild(footer);
                }

                function syncDate() {
                    button.firstChild && button.removeChild(button.firstChild);
                    button.insertBefore(document.createTextNode(input.value || 'mm/dd/yyyy'), button.firstChild);
                }
                button.addEventListener('click', function () {
                    wrapper.classList.toggle('open');
                    if (wrapper.classList.contains('open')) renderCalendar();
                });
                popup.addEventListener('click', function (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    var target = event.target.closest('button');
                    if (!target || !popup.contains(target)) return;
                    if (target.dataset.value) {
                        input.value = target.dataset.value;
                        input.dispatchEvent(new Event('change', { bubbles: true }));
                        view = new Date(input.value + 'T00:00:00');
                        syncDate();
                        wrapper.classList.remove('open');
                    } else if (target.dataset.step !== undefined) {
                        view.setMonth(view.getMonth() + Number(target.dataset.step));
                        renderCalendar();
                    } else if (target.dataset.action === 'clear') {
                        input.value = '';
                        syncDate();
                        wrapper.classList.remove('open');
                    } else if (target.dataset.action === 'today') {
                        input.value = today.toISOString().slice(0, 10);
                        view = new Date(input.value + 'T00:00:00');
                        syncDate();
                        wrapper.classList.remove('open');
                    }
                });
                popup.addEventListener('change', function (event) {
                    if (event.target.classList.contains('calendar-year')) {
                        var year = Math.min(9999, Math.max(1, Number(event.target.value) || today.getFullYear()));
                        view.setFullYear(year);
                        renderCalendar();
                    }
                });
                input.max = '9999-12-31';
                syncDate();
            });

            // Password toggle (ลูกตาดูรหัสผ่าน)
            document.querySelectorAll('input[type="password"]').forEach(function (input) {
                if (input.parentElement && input.parentElement.classList.contains('password-wrap')) return;

                var wrapper = document.createElement('div');
                wrapper.className = 'password-wrap';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                var toggleBtn = document.createElement('button');
                toggleBtn.type = 'button';
                toggleBtn.className = 'btn-toggle-password';
                toggleBtn.setAttribute('aria-label', 'แสดงรหัสผ่าน');
                toggleBtn.setAttribute('title', 'แสดงรหัสผ่าน');
                toggleBtn.innerHTML = '<svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>' +
                    '<svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
                wrapper.appendChild(toggleBtn);

                toggleBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    var isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    var openEye = toggleBtn.querySelector('.eye-open');
                    var closedEye = toggleBtn.querySelector('.eye-closed');
                    if (isPassword) {
                        openEye.style.display = 'none';
                        closedEye.style.display = 'block';
                        toggleBtn.setAttribute('aria-label', 'ซ่อนรหัสผ่าน');
                        toggleBtn.setAttribute('title', 'ซ่อนรหัสผ่าน');
                    } else {
                        openEye.style.display = 'block';
                        closedEye.style.display = 'none';
                        toggleBtn.setAttribute('aria-label', 'แสดงรหัสผ่าน');
                        toggleBtn.setAttribute('title', 'แสดงรหัสผ่าน');
                    }
                });
            });

            document.addEventListener('click', function (event) {
                document.querySelectorAll('.select-wrap.open').forEach(function (wrapper) {
                    if (!wrapper.contains(event.target)) {
                        wrapper.classList.remove('open');
                        wrapper.querySelector('.select-button').setAttribute('aria-expanded', 'false');
                    }
                });
                document.querySelectorAll('.date-wrap.open').forEach(function (wrapper) {
                    if (!wrapper.contains(event.target)) wrapper.classList.remove('open');
                });
            });
        });
    </script>
</head>

<body>
<nav class="nav" th:fragment="nav(active)">
    <div class="nav-inner">
        <a class="brand" th:href="@{/posts}"><span class="dot"></span>SportMate</a>
        <button class="hamburger" aria-label="เมนู" onclick="document.querySelector('.nav-links').classList.toggle('open');this.classList.toggle('open')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
                <div class="nav-links">
            <a class="link" th:classappend="${active=='posts'}?'active'" th:href="@{/posts}">Post</a>
            <a class="link" th:classappend="${active=='tournaments'}?'active'" th:href="@{/tournaments}">Tournament</a>
            <a class="link" th:classappend="${active=='archive'}?'active'" th:href="@{/archive}">จัดเก็บกิจกรรม</a>
            <span class="spacer"></span>
            <a class="bell" th:classappend="${active=='notifications'}?'active'" th:href="@{/notifications}" title="การแจ้งเตือน">
                🔔<span class="bell-badge" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}">0</span>
            </a>
            <a class="link who-link" th:if="${currentUser}"
               th:classappend="${active=='profile'}?'active'"
               th:href="@{/profile}" title="ไปที่โปรไฟล์ของฉัน">
                <span class="who-avatar"
                      th:text="${#strings.isEmpty(currentUser.userName)} ? '?' : ${#strings.toUpperCase(#strings.substring(currentUser.userName,0,1))}">S</span>
                <span class="who-name" th:text="${currentUser.userName}">user</span>
                <span class="badge-member" th:if="${currentUser.member}">Member</span>
            </a>
            <a class="link" th:if="${currentUser == null}"
               th:classappend="${active=='profile'}?'active'" th:href="@{/profile}">โปรไฟล์</a>
            <a class="link" th:href="@{/logout}">ออกจากระบบ</a>
        </div>
    </div>
</nav>

<!-- ===== filter/search bar (ใช้ทั้งหน้า posts และ tournaments) ===== -->
<div class="filter-bar" th:fragment="filterBar(action)">
    <form method="get" th:action="@{__${action}__}">
        <div class="filter-intro">
            <div class="filter-title-row">
                <span class="filter-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                </span>
                <div>
                    <strong>ค้นหากิจกรรม</strong>
                    <span>เลือกเงื่อนไขที่ต้องการ แล้วค้นหากิจกรรมที่ใช่สำหรับคุณ</span>
                </div>
            </div>
            <span class="filter-hint">กรองได้หลายเงื่อนไข</span>
        </div>
        <div class="filter-grid">
            <div class="field filter-field">
                <label>ประเภทกีฬา</label>
                <select name="sportId">
                    <option value="">ทั้งหมด</option>
                    <option th:each="s : ${sports}" th:value="${s.id}" th:text="${s.name}"
                            th:selected="${fSportId != null and fSportId == s.id}"></option>
                </select>
            </div>
            <div class="field filter-field">
                <label>สถานที่</label>
                <select name="locationId">
                    <option value="">ทั้งหมด</option>
                    <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.name}"
                            th:selected="${fLocationId != null and fLocationId == l.id}"></option>
                </select>
            </div>
            <div class="field filter-field">
                <label>วันที่</label>
                <input type="date" name="date" th:value="${fDate}">
            </div>
            <div class="field filter-field">
                <label>เวลา (ตั้งแต่)</label>
                <input type="time" name="time" th:value="${fTime}">
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary btn-sm" type="submit">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
                    </svg>
                    ค้นหา
                </button>
                <a class="btn btn-ghost btn-sm" th:href="@{__${action}__}">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v6h6"></path>
                    </svg>
                    ล้าง
                </a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
