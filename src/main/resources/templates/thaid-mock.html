<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('เข้าสู่ระบบด้วย ThaiD (จำลอง)')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand"><span class="dot"></span>SPORTMATE</div>
        <div class="auth-sub">ยืนยันตัวตนด้วย ThaiD (ข้อมูลจำลองสำหรับทดสอบเท่านั้น)</div>

        <div class="flash err" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/thaid-mock/login}">
            <div class="field">
                <label>เลขบัตรประชาชน (13 หลัก)</label>
                <input name="pid" maxlength="13" pattern="\d{13}" placeholder="ใส่ตัวเลข 13 หลัก" required autofocus>
            </div>
            <div class="field">
                <label>ชื่อ-นามสกุล</label>
                <input name="fullName" required>
            </div>
            <button class="btn btn-primary" style="width:100%">ยืนยันตัวตน</button>
        </form>

        <div class="auth-alt"><a th:href="@{/login}"><span class="line-icon arrow" aria-hidden="true"></span> กลับไปหน้าเข้าสู่ระบบ</a></div>
    </div>
</div>
</body>
</html>
