spring.application.name=SportMate

spring.datasource.url=jdbc:mysql://localhost:3306/sportmate?useSSL=false&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ชื่อ table/column เป็น PascalCase และมีคำสงวน (User, Text) จึงให้ quote อัตโนมัติ
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false


server.port=${PORT:8080}

server.forward-headers-strategy=${FORWARD_HEADERS:framework}

app.remember-me-secret=${REMEMBER_ME_SECRET:change-this-sportmate-secret-in-production}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---- บัญชีผู้ดูแลระบบ (ค่าจริงมาจาก .env / environment) ----
sportmate.admin.username=${ADMIN_USERNAME:admin}
sportmate.admin.email=${ADMIN_EMAIL:admin@sportmate.local}
sportmate.admin.password=${ADMIN_PASSWORD:}