spring.application.name=SportMate

# ---- MySQL (Docker localhost) ----
spring.datasource.url=jdbc:mysql://localhost:3306/sportmate?useSSL=false&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ใช้ schema จาก db/init (docker) เป็นหลัก จึงไม่ให้ Hibernate สร้าง/แก้ตาราง
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ชื่อ table/column เป็น PascalCase และมีคำสงวน (User, Text) จึงให้ quote อัตโนมัติ
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# สำคัญ: ปิดการแปลงชื่อ table/column อัตโนมัติของ Hibernate (default จะแปลงเป็น snake_case/lowercase
# เช่น "User" -> "user", "PostName" -> "post_name") ซึ่งจะไม่ตรงกับชื่อจริงใน schema.sql
# (MySQL บน Linux/Docker เป็น case-sensitive สำหรับชื่อตาราง ต่างจาก Windows/Mac ที่ไม่สนตัวพิมพ์เล็ก-ใหญ่)
# ตั้งค่านี้เพื่อบังคับให้ใช้ชื่อที่เขียนใน @Table/@Column ตรงๆ ไม่แปลงอะไรเลย
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Server ----
# Cloud Run จะส่ง env "PORT" มาให้ (ปกติ 8080) — ถ้าไม่มีก็ใช้ 8080 ตามเดิม
server.port=${PORT:8080}
